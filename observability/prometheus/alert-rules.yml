groups:
  - name: notification-platform-alerts
    rules:
      - alert: HighApiLatency
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{service="notification-api-service"}[5m])) by (le)) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Notification API p95 latency is above 1s
      - alert: WorkerHighFailureRate
        expr: sum(rate(worker_messages_failed_total[5m])) / clamp_min(sum(rate(worker_messages_consumed_total[5m])), 1) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Worker failure rate is above 5%
      - alert: ProviderHighErrorRate
        expr: sum(rate(provider_error_total[5m])) / clamp_min(sum(rate(delivery_attempt_total[5m])), 1) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Provider error rate is above 5%
      - alert: DeadLetterEventsDetected
        expr: sum(worker_dlq_total) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Kafka worker dead-letter events detected
      - alert: OrchestratorOutboxPublishFailures
        expr: increase(orchestrator_outbox_failures_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Orchestrator could not publish one or more outbox records
      - alert: AdminBffDownstreamErrors
        expr: increase(admin_bff_downstream_error_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Admin BFF downstream errors exceeded threshold
