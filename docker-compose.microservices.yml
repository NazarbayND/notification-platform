x-observability-env: &observability-env
  ENVIRONMENT: local
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local,service.namespace=notification-platform
  MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: 1.0

services:
  postgres:
    image: postgres:16
    container_name: notification-platform-ms-postgres
    environment:
      POSTGRES_DB: notification_platform
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
    ports:
      - "5432:5432"
    volumes:
      - microservices-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notification_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: notification-platform-ms-rabbitmq
    command: sh -c "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"
    environment:
      RABBITMQ_DEFAULT_USER: notification
      RABBITMQ_DEFAULT_PASS: notification
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    volumes:
      - microservices-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: notification-platform-ms-redis
    ports:
      - "6379:6379"
    volumes:
      - microservices-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.9.1
    container_name: notification-platform-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9092:9092"
    volumes:
      - microservices-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  kafka-topic-init:
    image: apache/kafka:3.9.1
    container_name: notification-platform-kafka-topic-init
    command: ["bash", "/scripts/create-topics.sh", "kafka:29092"]
    volumes:
      - ./scripts/kafka:/scripts:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: notification-platform-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog
    container_name: notification-platform-ms-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  notification-api-service:
    build:
      context: ./services/notification-api-service
    image: notification-platform/notification-api-service:local
    environment:
      <<: *observability-env
      OTEL_SERVICE_NAME: notification-api-service
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_platform?currentSchema=notification_api
      SPRING_DATASOURCE_USERNAME: notification
      SPRING_DATASOURCE_PASSWORD: notification
      SPRING_FLYWAY_SCHEMAS: notification_api
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NOTIFICATION_BROKER_INTAKE: kafka
      NOTIFICATION_BROKER_DELIVERY: rabbitmq
      NOTIFICATION_KAFKA_TOPICS_REQUESTS: notification.requests.v1
      NOTIFICATION_INTAKE_GLOBAL_RATE_PER_SECOND: 5000
      NOTIFICATION_INTAKE_PER_TENANT_RATE_PER_SECOND: 500
      NOTIFICATION_INTAKE_MAX_CONCURRENT_REQUESTS: 1000
      NOTIFICATION_INTAKE_MAX_REQUEST_BYTES: 262144
      NOTIFICATION_INTAKE_MAX_RECIPIENTS_PER_REQUEST: 1000
      NOTIFICATION_INTAKE_MAX_CHANNELS_PER_REQUEST: 5
      NOTIFICATION_INTAKE_KAFKA_PUBLISH_TIMEOUT: 3s
      TEMPLATE_SERVICE_URL: http://template-service:8082
      PREFERENCE_SERVICE_URL: http://preference-service:8083
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-topic-init:
        condition: service_completed_successfully
      template-service:
        condition: service_started
      preference-service:
        condition: service_started

  template-service:
    build:
      context: ./services/template-service
    image: notification-platform/template-service:local
    environment:
      <<: *observability-env
      OTEL_SERVICE_NAME: template-service
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_platform?currentSchema=template
      SPRING_DATASOURCE_USERNAME: notification
      SPRING_DATASOURCE_PASSWORD: notification
      SPRING_FLYWAY_SCHEMAS: template
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  preference-service:
    build:
      context: ./services/preference-service
    image: notification-platform/preference-service:local
    environment:
      <<: *observability-env
      OTEL_SERVICE_NAME: preference-service
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_platform?currentSchema=preference
      SPRING_DATASOURCE_USERNAME: notification
      SPRING_DATASOURCE_PASSWORD: notification
      SPRING_FLYWAY_SCHEMAS: preference
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  outbox-publisher-service:
    build:
      context: ./services/outbox-publisher-service
    image: notification-platform/outbox-publisher-service:local
    environment:
      <<: *observability-env
      OTEL_SERVICE_NAME: outbox-publisher-service
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_platform?currentSchema=notification_api
      SPRING_DATASOURCE_USERNAME: notification
      SPRING_DATASOURCE_PASSWORD: notification
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: notification
      SPRING_RABBITMQ_PASSWORD: notification
      OUTBOX_BATCH_SIZE: 500
      OUTBOX_FIXED_DELAY_MS: 250
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      notification-api-service:
        condition: service_started

  email-worker-service:
    build:
      context: ./services/email-worker-service
    image: notification-platform/email-worker-service:local
    environment:
      <<: *observability-env
      OTEL_SERVICE_NAME: email-worker-service
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_platform?currentSchema=delivery_email
      SPRING_DATASOURCE_USERNAME: notification
      SPRING_DATASOURCE_PASSWORD: notification
      SPRING_FLYWAY_SCHEMAS: delivery_email
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: notification
      SPRING_RABBITMQ_PASSWORD: notification
      EMAIL_PROVIDER: smtp
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started

  sms-worker-service:
    build:
      context: ./services/sms-worker-service
    image: notification-platform/sms-worker-service:local
    environment:
      <<: *observability-env
      OTEL_SERVICE_NAME: sms-worker-service
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_platform?currentSchema=delivery_sms
      SPRING_DATASOURCE_USERNAME: notification
      SPRING_DATASOURCE_PASSWORD: notification
      SPRING_FLYWAY_SCHEMAS: delivery_sms
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: notification
      SPRING_RABBITMQ_PASSWORD: notification
      SMS_PROVIDER: test
      TEST_PROVIDER_FAILURE_RATE: 0.0
      TEST_PROVIDER_LATENCY_MS: 0
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  push-worker-service:
    build:
      context: ./services/push-worker-service
    image: notification-platform/push-worker-service:local
    environment:
      <<: *observability-env
      OTEL_SERVICE_NAME: push-worker-service
      SERVER_PORT: 8087
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_platform?currentSchema=delivery_push
      SPRING_DATASOURCE_USERNAME: notification
      SPRING_DATASOURCE_PASSWORD: notification
      SPRING_FLYWAY_SCHEMAS: delivery_push
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: notification
      SPRING_RABBITMQ_PASSWORD: notification
      PUSH_PROVIDER: test
      TEST_PROVIDER_FAILURE_RATE: 0.0
      TEST_PROVIDER_LATENCY_MS: 0
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  in-app-worker-service:
    build:
      context: ./services/in-app-worker-service
    image: notification-platform/in-app-worker-service:local
    environment:
      <<: *observability-env
      OTEL_SERVICE_NAME: in-app-worker-service
      SERVER_PORT: 8089
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_platform?currentSchema=delivery_in_app
      SPRING_DATASOURCE_USERNAME: notification
      SPRING_DATASOURCE_PASSWORD: notification
      SPRING_FLYWAY_SCHEMAS: delivery_in_app
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: notification
      SPRING_RABBITMQ_PASSWORD: notification
      IN_APP_PROVIDER: db
      TEST_PROVIDER_FAILURE_RATE: 0.0
      TEST_PROVIDER_LATENCY_MS: 0
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    ports:
      - "8089:8089"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  webhook-worker-service:
    build:
      context: ./services/webhook-worker-service
    image: notification-platform/webhook-worker-service:local
    environment:
      <<: *observability-env
      OTEL_SERVICE_NAME: webhook-worker-service
      SERVER_PORT: 8090
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_platform?currentSchema=delivery_webhook
      SPRING_DATASOURCE_USERNAME: notification
      SPRING_DATASOURCE_PASSWORD: notification
      SPRING_FLYWAY_SCHEMAS: delivery_webhook
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: notification
      SPRING_RABBITMQ_PASSWORD: notification
      WEBHOOK_PROVIDER: test
      TEST_PROVIDER_FAILURE_RATE: 0.0
      TEST_PROVIDER_LATENCY_MS: 0
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  admin-bff-service:
    build:
      context: ./services/admin-bff-service
    image: notification-platform/admin-bff-service:local
    environment:
      <<: *observability-env
      OTEL_SERVICE_NAME: admin-bff-service
      SERVER_PORT: 8088
      NOTIFICATION_API_URL: http://notification-api-service:8081
      TEMPLATE_SERVICE_URL: http://template-service:8082
      PREFERENCE_SERVICE_URL: http://preference-service:8083
      OUTBOX_PUBLISHER_SERVICE_URL: http://outbox-publisher-service:8084
      EMAIL_WORKER_SERVICE_URL: http://email-worker-service:8085
      SMS_WORKER_SERVICE_URL: http://sms-worker-service:8086
      PUSH_WORKER_SERVICE_URL: http://push-worker-service:8087
      IN_APP_WORKER_SERVICE_URL: http://in-app-worker-service:8089
      WEBHOOK_WORKER_SERVICE_URL: http://webhook-worker-service:8090
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    ports:
      - "8088:8088"
    depends_on:
      - notification-api-service
      - template-service
      - preference-service
      - in-app-worker-service
      - webhook-worker-service

  admin-frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    image: notification-platform/admin-frontend:local
    ports:
      - "5173:80"
    depends_on:
      - admin-bff-service

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: notification-platform-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - notification-api-service
      - template-service
      - preference-service
      - outbox-publisher-service
      - email-worker-service
      - sms-worker-service
      - push-worker-service
      - in-app-worker-service
      - webhook-worker-service
      - admin-bff-service

  grafana:
    image: grafana/grafana:11.3.0
    container_name: notification-platform-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.63.0
    container_name: notification-platform-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: notification-platform-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./observability/otel/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
    depends_on:
      - jaeger

  loki:
    image: grafana/loki:3.3.0
    container_name: notification-platform-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.3.0
    container_name: notification-platform-promtail
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki

volumes:
  microservices-postgres-data:
  microservices-rabbitmq-data:
  microservices-redis-data:
  microservices-kafka-data:
  grafana-data:
  loki-data:
