services:
  postgres:
    image: postgres:16
    container_name: notification-platform-ms-postgres
    environment:
      POSTGRES_DB: notification_platform
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
    ports:
      - "5432:5432"
    volumes:
      - microservices-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notification_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: notification-platform-ms-rabbitmq
    command: sh -c "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"
    environment:
      RABBITMQ_DEFAULT_USER: notification
      RABBITMQ_DEFAULT_PASS: notification
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    volumes:
      - microservices-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: notification-platform-ms-redis
    ports:
      - "6379:6379"
    volumes:
      - microservices-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    container_name: notification-platform-ms-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  notification-api-service:
    build:
      context: ./services/notification-api-service
    image: notification-platform/notification-api-service:local
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_platform?currentSchema=notification_api
      SPRING_DATASOURCE_USERNAME: notification
      SPRING_DATASOURCE_PASSWORD: notification
      SPRING_FLYWAY_SCHEMAS: notification_api
      TEMPLATE_SERVICE_URL: http://template-service:8082
      PREFERENCE_SERVICE_URL: http://preference-service:8083
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      template-service:
        condition: service_started
      preference-service:
        condition: service_started

  template-service:
    build:
      context: ./services/template-service
    image: notification-platform/template-service:local
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_platform?currentSchema=template
      SPRING_DATASOURCE_USERNAME: notification
      SPRING_DATASOURCE_PASSWORD: notification
      SPRING_FLYWAY_SCHEMAS: template
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  preference-service:
    build:
      context: ./services/preference-service
    image: notification-platform/preference-service:local
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_platform?currentSchema=preference
      SPRING_DATASOURCE_USERNAME: notification
      SPRING_DATASOURCE_PASSWORD: notification
      SPRING_FLYWAY_SCHEMAS: preference
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  outbox-publisher-service:
    build:
      context: ./services/outbox-publisher-service
    image: notification-platform/outbox-publisher-service:local
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_platform?currentSchema=notification_api
      SPRING_DATASOURCE_USERNAME: notification
      SPRING_DATASOURCE_PASSWORD: notification
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: notification
      SPRING_RABBITMQ_PASSWORD: notification
      OUTBOX_BATCH_SIZE: 500
      OUTBOX_FIXED_DELAY_MS: 250
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      notification-api-service:
        condition: service_started

  email-worker-service:
    build:
      context: ./services/email-worker-service
    image: notification-platform/email-worker-service:local
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_platform?currentSchema=delivery_email
      SPRING_DATASOURCE_USERNAME: notification
      SPRING_DATASOURCE_PASSWORD: notification
      SPRING_FLYWAY_SCHEMAS: delivery_email
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: notification
      SPRING_RABBITMQ_PASSWORD: notification
      EMAIL_PROVIDER: smtp
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started

  sms-worker-service:
    build:
      context: ./services/sms-worker-service
    image: notification-platform/sms-worker-service:local
    environment:
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_platform?currentSchema=delivery_sms
      SPRING_DATASOURCE_USERNAME: notification
      SPRING_DATASOURCE_PASSWORD: notification
      SPRING_FLYWAY_SCHEMAS: delivery_sms
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: notification
      SPRING_RABBITMQ_PASSWORD: notification
      SMS_PROVIDER: test
      TEST_PROVIDER_FAILURE_RATE: 0.0
      TEST_PROVIDER_LATENCY_MS: 0
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  push-worker-service:
    build:
      context: ./services/push-worker-service
    image: notification-platform/push-worker-service:local
    environment:
      SERVER_PORT: 8087
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_platform?currentSchema=delivery_push
      SPRING_DATASOURCE_USERNAME: notification
      SPRING_DATASOURCE_PASSWORD: notification
      SPRING_FLYWAY_SCHEMAS: delivery_push
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: notification
      SPRING_RABBITMQ_PASSWORD: notification
      PUSH_PROVIDER: test
      TEST_PROVIDER_FAILURE_RATE: 0.0
      TEST_PROVIDER_LATENCY_MS: 0
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  in-app-worker-service:
    build:
      context: ./services/in-app-worker-service
    image: notification-platform/in-app-worker-service:local
    environment:
      SERVER_PORT: 8089
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_platform?currentSchema=delivery_in_app
      SPRING_DATASOURCE_USERNAME: notification
      SPRING_DATASOURCE_PASSWORD: notification
      SPRING_FLYWAY_SCHEMAS: delivery_in_app
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: notification
      SPRING_RABBITMQ_PASSWORD: notification
      IN_APP_PROVIDER: db
      TEST_PROVIDER_FAILURE_RATE: 0.0
      TEST_PROVIDER_LATENCY_MS: 0
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    ports:
      - "8089:8089"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  webhook-worker-service:
    build:
      context: ./services/webhook-worker-service
    image: notification-platform/webhook-worker-service:local
    environment:
      SERVER_PORT: 8090
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_platform?currentSchema=delivery_webhook
      SPRING_DATASOURCE_USERNAME: notification
      SPRING_DATASOURCE_PASSWORD: notification
      SPRING_FLYWAY_SCHEMAS: delivery_webhook
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: notification
      SPRING_RABBITMQ_PASSWORD: notification
      WEBHOOK_PROVIDER: test
      TEST_PROVIDER_FAILURE_RATE: 0.0
      TEST_PROVIDER_LATENCY_MS: 0
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  admin-bff-service:
    build:
      context: ./services/admin-bff-service
    image: notification-platform/admin-bff-service:local
    environment:
      SERVER_PORT: 8088
      NOTIFICATION_API_URL: http://notification-api-service:8081
      TEMPLATE_SERVICE_URL: http://template-service:8082
      PREFERENCE_SERVICE_URL: http://preference-service:8083
      OUTBOX_PUBLISHER_SERVICE_URL: http://outbox-publisher-service:8084
      EMAIL_WORKER_SERVICE_URL: http://email-worker-service:8085
      SMS_WORKER_SERVICE_URL: http://sms-worker-service:8086
      PUSH_WORKER_SERVICE_URL: http://push-worker-service:8087
      IN_APP_WORKER_SERVICE_URL: http://in-app-worker-service:8089
      WEBHOOK_WORKER_SERVICE_URL: http://webhook-worker-service:8090
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    ports:
      - "8088:8088"
    depends_on:
      - notification-api-service
      - template-service
      - preference-service
      - in-app-worker-service
      - webhook-worker-service

  admin-frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    image: notification-platform/admin-frontend:local
    ports:
      - "5173:80"
    depends_on:
      - admin-bff-service

volumes:
  microservices-postgres-data:
  microservices-rabbitmq-data:
  microservices-redis-data:
