spring:
  application:
    name: notification-platform
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/notification_platform}
    username: ${DATABASE_USERNAME:notification}
    password: ${DATABASE_PASSWORD:notification}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:notification}
    password: ${RABBITMQ_PASSWORD:notification}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: ${RABBITMQ_PREFETCH:10}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: notification-platform
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-},spanId=%X{spanId:-},notificationRequestId=%X{notificationRequestId:-},deliveryId=%X{deliveryId:-},outboxEventId=%X{outboxEventId:-}]"

notification:
  cache:
    template-ttl: ${NOTIFICATION_TEMPLATE_CACHE_TTL:PT10M}
    preference-ttl: ${NOTIFICATION_PREFERENCE_CACHE_TTL:PT10M}
    idempotency-ttl: ${NOTIFICATION_IDEMPOTENCY_CACHE_TTL:PT30M}
  email:
    provider: mock
    from: ${NOTIFICATION_EMAIL_FROM:no-reply@notification-platform.local}
    failure-mode: ${NOTIFICATION_EMAIL_FAILURE_MODE:SUCCESS}
    timeout-duration: ${NOTIFICATION_EMAIL_TIMEOUT_DURATION:PT2S}
  delivery:
    permanent-failure-status: ${NOTIFICATION_PERMANENT_FAILURE_STATUS:DEAD_LETTERED}
  rabbitmq:
    exchange: notifications.exchange
    retry-delay: PT1M
    publisher-confirm-timeout: ${NOTIFICATION_RABBITMQ_PUBLISHER_CONFIRM_TIMEOUT:PT5S}

outbox:
  publisher:
    batch-size: ${OUTBOX_PUBLISHER_BATCH_SIZE:1000}
    fixed-delay-ms: ${OUTBOX_PUBLISHER_FIXED_DELAY_MS:100}
