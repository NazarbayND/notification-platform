apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-projection-service
  namespace: notification-platform
spec:
  template:
    spec:
      serviceAccountName: notification-projection-service
      containers:
        - name: notification-projection-service
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dynamodb
            - name: NOTIFICATION_PROJECTION_STORE
              value: dynamodb
            - name: AWS_REGION
              value: us-east-1
            - name: DYNAMODB_NOTIFICATIONS_TABLE
              value: notification-projections
            - name: DYNAMODB_DELIVERIES_TABLE
              value: notification-deliveries
            - name: DYNAMODB_ATTEMPTS_TABLE
              value: notification-delivery-attempts
            - name: DYNAMODB_PROCESSED_EVENTS_TABLE
              value: notification-processed-events
