apiVersion: v1
data:
  admin-bff-dashboard.json: |
    {
      "uid": "notification-platform-admin-bff",
      "title": "Admin BFF Dashboard",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        { "type": "timeseries", "title": "Admin requests/sec", "gridPos": { "x": 0, "y": 0, "w": 8, "h": 6 }, "targets": [{ "expr": "sum(rate(http_server_requests_seconds_count{service=\"admin-bff-service\"}[1m])) by (uri)", "legendFormat": "{{uri}}" }] },
        { "type": "timeseries", "title": "Admin average latency", "gridPos": { "x": 8, "y": 0, "w": 8, "h": 6 }, "targets": [{ "expr": "sum by (endpoint) (rate(admin_bff_request_duration_seconds_sum[5m])) / clamp_min(sum by (endpoint) (rate(admin_bff_request_duration_seconds_count[5m])), 0.001)", "legendFormat": "{{endpoint}}" }] },
        { "type": "timeseries", "title": "Downstream errors by service", "gridPos": { "x": 16, "y": 0, "w": 8, "h": 6 }, "targets": [{ "expr": "sum(rate(admin_bff_downstream_error_total[5m])) by (service)", "legendFormat": "{{service}}" }] },
        { "type": "timeseries", "title": "Dashboard stats average latency", "gridPos": { "x": 0, "y": 6, "w": 12, "h": 6 }, "targets": [{ "expr": "sum(rate(admin_bff_request_duration_seconds_sum{endpoint=\"dashboard\"}[5m])) / clamp_min(sum(rate(admin_bff_request_duration_seconds_count{endpoint=\"dashboard\"}[5m])), 0.001)" }] }
      ]
    }
  notification-platform-overview.json: |
    {
      "uid": "notification-platform-overview",
      "title": "Notification Platform Overview",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        { "type": "timeseries", "title": "Requests per second", "gridPos": { "x": 0, "y": 0, "w": 8, "h": 7 }, "targets": [{ "expr": "sum(rate(http_server_requests_seconds_count[1m])) by (service)", "legendFormat": "{{service}}" }] },
        { "type": "timeseries", "title": "Average API latency", "gridPos": { "x": 8, "y": 0, "w": 8, "h": 7 }, "targets": [{ "expr": "sum by (service) (rate(http_server_requests_seconds_sum[5m])) / clamp_min(sum by (service) (rate(http_server_requests_seconds_count[5m])), 0.001)", "legendFormat": "{{service}}" }] },
        { "type": "timeseries", "title": "Accepted notification requests", "gridPos": { "x": 16, "y": 0, "w": 8, "h": 7 }, "targets": [{ "expr": "sum(rate(notification_intake_accepted_total[1m]))" }] },
        { "type": "stat", "title": "Sent vs failed notifications", "gridPos": { "x": 0, "y": 7, "w": 6, "h": 5 }, "targets": [{ "expr": "sum(delivery_attempt_total{status=\"SENT\"})", "legendFormat": "sent" }, { "expr": "sum(delivery_attempt_total{status=\"FAILED\"})", "legendFormat": "failed" }] },
        { "type": "stat", "title": "Orchestrator outbox failures", "gridPos": { "x": 6, "y": 7, "w": 6, "h": 5 }, "targets": [{ "expr": "sum(orchestrator_outbox_failures_total)" }] },
        { "type": "timeseries", "title": "Orchestrator publish rate", "gridPos": { "x": 12, "y": 7, "w": 6, "h": 5 }, "targets": [{ "expr": "sum(rate(orchestrator_outbox_published_total[1m])) by (target)", "legendFormat": "{{target}}" }] },
        { "type": "timeseries", "title": "Worker processing rate", "gridPos": { "x": 18, "y": 7, "w": 6, "h": 5 }, "targets": [{ "expr": "sum(rate(worker_messages_processed_total[1m])) by (service, channel)", "legendFormat": "{{service}} {{channel}}" }] },
        { "type": "timeseries", "title": "Worker error rate", "gridPos": { "x": 0, "y": 12, "w": 8, "h": 6 }, "targets": [{ "expr": "sum(rate(worker_messages_failed_total[5m])) by (service, channel)", "legendFormat": "{{service}} {{channel}}" }] },
        { "type": "timeseries", "title": "Provider average latency", "gridPos": { "x": 8, "y": 12, "w": 8, "h": 6 }, "targets": [{ "expr": "sum by (channel, provider) (rate(provider_request_duration_seconds_sum[5m])) / clamp_min(sum by (channel, provider) (rate(provider_request_duration_seconds_count[5m])), 0.001)", "legendFormat": "{{channel}} {{provider}}" }] },
        { "type": "timeseries", "title": "Provider error rate", "gridPos": { "x": 16, "y": 12, "w": 8, "h": 6 }, "targets": [{ "expr": "sum(rate(provider_error_total[5m])) by (channel, provider, errorCode, error_code)", "legendFormat": "{{channel}} {{provider}} {{errorCode}}{{error_code}}" }] },
        { "type": "stat", "title": "Duplicate events skipped", "gridPos": { "x": 0, "y": 18, "w": 8, "h": 5 }, "targets": [{ "expr": "sum(worker_duplicate_events_skipped_total)" }] },
        { "type": "stat", "title": "Worker DLQ count", "gridPos": { "x": 8, "y": 18, "w": 8, "h": 5 }, "targets": [{ "expr": "sum(worker_dlq_total)" }] }
      ]
    }
  worker-dashboard.json: |
    {
      "uid": "notification-platform-workers",
      "title": "Worker Dashboard",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        { "type": "timeseries", "title": "Consumed messages/sec by worker", "gridPos": { "x": 0, "y": 0, "w": 8, "h": 6 }, "targets": [{ "expr": "sum(rate(worker_messages_consumed_total[1m])) by (service, channel)", "legendFormat": "{{service}} {{channel}}" }] },
        { "type": "timeseries", "title": "Processed messages/sec", "gridPos": { "x": 8, "y": 0, "w": 8, "h": 6 }, "targets": [{ "expr": "sum(rate(worker_messages_processed_total[1m])) by (service, channel)", "legendFormat": "{{service}} {{channel}}" }] },
        { "type": "timeseries", "title": "Failed messages/sec", "gridPos": { "x": 16, "y": 0, "w": 8, "h": 6 }, "targets": [{ "expr": "sum(rate(worker_messages_failed_total[1m])) by (service, channel, reason)", "legendFormat": "{{service}} {{channel}} {{reason}}" }] },
        { "type": "timeseries", "title": "Duplicate skipped/sec", "gridPos": { "x": 0, "y": 6, "w": 8, "h": 6 }, "targets": [{ "expr": "sum(rate(worker_duplicate_events_skipped_total[1m])) by (service, channel)", "legendFormat": "{{service}} {{channel}}" }] },
        { "type": "timeseries", "title": "Average processing duration", "gridPos": { "x": 8, "y": 6, "w": 8, "h": 6 }, "targets": [{ "expr": "sum by (service, channel) (rate(worker_processing_duration_seconds_sum[5m])) / clamp_min(sum by (service, channel) (rate(worker_processing_duration_seconds_count[5m])), 0.001)", "legendFormat": "{{service}} {{channel}}" }] },
        { "type": "timeseries", "title": "Delivery attempts by status", "gridPos": { "x": 16, "y": 6, "w": 8, "h": 6 }, "targets": [{ "expr": "sum(rate(delivery_attempt_total[1m])) by (channel, provider, status)", "legendFormat": "{{channel}} {{provider}} {{status}}" }] },
        { "type": "timeseries", "title": "Provider average duration", "gridPos": { "x": 0, "y": 12, "w": 12, "h": 6 }, "targets": [{ "expr": "sum by (channel, provider) (rate(provider_request_duration_seconds_sum[5m])) / clamp_min(sum by (channel, provider) (rate(provider_request_duration_seconds_count[5m])), 0.001)", "legendFormat": "{{channel}} {{provider}}" }] },
        { "type": "timeseries", "title": "Provider errors by code", "gridPos": { "x": 12, "y": 12, "w": 12, "h": 6 }, "targets": [{ "expr": "sum(rate(provider_error_total[5m])) by (channel, provider, errorCode, error_code)", "legendFormat": "{{channel}} {{provider}} {{errorCode}}{{error_code}}" }] }
      ]
    }
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: observability
