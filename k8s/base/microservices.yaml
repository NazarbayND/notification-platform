                  name: notification-platform-config
                  key: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: notification-platform-config
                  key: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              valueFrom:
                configMapKeyRef:
                  name: notification-platform-config
                  key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
            - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
              valueFrom:
                configMapKeyRef:
                  name: notification-platform-config
                  key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/notification_platform?currentSchema=notification_api
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: notification-platform-secrets
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
