apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: notification-orchestrator-kafka
  namespace: notification-platform
spec:
  scaleTargetRef:
    name: notification-orchestrator-service
  minReplicaCount: 2
  maxReplicaCount: 20
  pollingInterval: 15
  cooldownPeriod: 60
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-kafka-bootstrap.kafka.svc:9092
        consumerGroup: notification-orchestrator-v1
        topic: notification.requests.v1
        lagThreshold: "500"
        offsetResetPolicy: earliest
---
