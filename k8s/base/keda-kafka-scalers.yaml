  namespace: notification-platform
spec:
  scaleTargetRef:
    name: notification-projection-service
  minReplicaCount: 2
  maxReplicaCount: 12
  pollingInterval: 15
  cooldownPeriod: 60
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-kafka-bootstrap.kafka.svc:9092
        consumerGroup: notification-projection-results-v1
        topic: notification.delivery-results.v1
        lagThreshold: "1000"
        offsetResetPolicy: earliest
