name: k6 smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Running Notification Platform base URL"
        required: true
        default: "http://localhost:8080"
      product_id:
        description: "Optional existing product id"
        required: false
        default: ""
      template_key:
        description: "Optional existing template key"
        required: false
        default: ""

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Run smoke test
        env:
          BASE_URL: ${{ inputs.base_url }}
          PRODUCT_ID: ${{ inputs.product_id }}
          TEMPLATE_KEY: ${{ inputs.template_key }}
        run: k6 run tests/load/smoke.js
